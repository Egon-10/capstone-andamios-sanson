# =====================================================================
# HTTPS para el servidor de producción (SEG-IN-01)
#
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
#
# Agrega Caddy delante del frontend: obtiene y renueva solo el certificado
# de Let's Encrypt para DOMINIO y redirige HTTP a HTTPS. En .env:
#   DOMINIO=inventario-sanson.eastus2.cloudapp.azure.com
#   PUERTO_WEB=127.0.0.1:8080   (el frontend deja de publicarse hacia fuera)
#   CORS_ORIGENES=https://inventario-sanson.eastus2.cloudapp.azure.com
# =====================================================================

services:

  https:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    command: ["caddy", "reverse-proxy", "--from", "${DOMINIO:?Defina DOMINIO en .env}", "--to", "frontend:80"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Certificados y su renovación: sobreviven a la recreación del contenedor.
      - certificados:/data

volumes:
  certificados:
