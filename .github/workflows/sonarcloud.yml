name: Analisis estatico (SonarCloud)

# Complementa a CodeQL con las metricas de calidad que exige la Definition of
# Done: vulnerabilidades, deuda tecnica, codigo duplicado y cobertura.
#
# Requiere el secreto SONAR_TOKEN. Si no esta configurado el job se omite
# sin marcar la ejecucion como fallida (ver docs/sonarcloud.md).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]


# Una sola ejecucion por rama: si llegan varios push seguidos, se cancela la
# anterior. Evita que decenas de jobs compitan por los runners disponibles.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar si el token esta configurado
        id: token
        run: |
          if [ -n "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "configurado=si" >> "$GITHUB_OUTPUT"
          else
            echo "configurado=no" >> "$GITHUB_OUTPUT"
            echo "::notice title=SonarCloud omitido::Falta el secreto SONAR_TOKEN. Ver docs/sonarcloud.md para configurarlo."
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.configurado == 'si'
        with:
          # Sonar necesita el historico completo para atribuir los cambios
          fetch-depth: 0

      - name: Preparar Java 17
        if: steps.token.outputs.configurado == 'si'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Preparar Node 22
        if: steps.token.outputs.configurado == 'si'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar el backend y medir cobertura
        if: steps.token.outputs.configurado == 'si'
        working-directory: microservicio
        run: |
          mvn -B verify -Dtest='*ServiceTest,*ValidatorTest,*HandlerTest,*InitializerTest'
          mvn -B dependency:copy-dependencies -DoutputDirectory=target/dependency

      - name: Medir cobertura del frontend
        if: steps.token.outputs.configurado == 'si'
        working-directory: frontend
        run: |
          npm ci
          npx ng test --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Analizar con SonarCloud
        if: steps.token.outputs.configurado == 'si'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
