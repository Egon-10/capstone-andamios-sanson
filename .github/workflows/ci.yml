name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservicio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar y ejecutar pruebas unitarias
        run: mvn -B test -Dtest='*ServiceTest,*ValidatorTest,*HandlerTest,*InitializerTest' -Dsurefire.failIfNoSpecifiedTests=false
      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-backend
          path: microservicio/target/surefire-reports/

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Compilar
        run: npx ng build --configuration development
      - name: Pruebas unitarias
        run: npx ng test --watch=false --browsers=ChromeHeadless
