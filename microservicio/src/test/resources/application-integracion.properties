# Configuracion de las pruebas de integracion (perfil "integracion").
#
# Se ejecutan en la CI contra el MySQL del servicio del workflow, despues de
# aplicar las migraciones 01 a 05. Ningun valor secreto vive aqui: la clave de
# los tokens y las credenciales de la base llegan por variables de entorno que
# la CI genera en cada ejecucion.
spring.application.name=microservicio-integracion
server.port=0

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/inventario_andamios}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# El esquema lo crean las migraciones; Hibernate no lo toca. Asi, si una
# entidad no coincide con la base, la prueba falla en lugar de corregirlo.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:}
app.jwt.access-ttl-minutos=15
app.jwt.inactividad-minutos=30
app.cors.origenes=http://localhost:4200
app.admin.correo=
app.admin.password=

app.seguridad.intentos-maximos=5
app.seguridad.minutos-bloqueo=15
# Todas las pruebas inician sesion desde 127.0.0.1: el limite por origen se
# prueba aparte, en la prueba unitaria del filtro.
app.seguridad.limite-intentos-por-minuto=10000

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.error.include-stacktrace=never
server.error.include-message=never
