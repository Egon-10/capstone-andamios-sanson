# Configuracion del analisis estatico de SonarCloud (SEG-AP-06).
# Cubre los dos modulos del sistema en un solo proyecto de Sonar.
#
# Antes del primer analisis hay que crear el proyecto en https://sonarcloud.io
# y registrar el secreto SONAR_TOKEN en el repositorio. Los pasos estan en
# docs/sonarcloud.md. Mientras el secreto no exista, el job de CI se omite.

sonar.projectKey=Egon-10_capstone-andamios-sanson
sonar.organization=egon-10
sonar.projectName=Sistema de inventario - Andamios Sanson
sonar.host.url=https://sonarcloud.io

# Codigo de produccion
sonar.sources=microservicio/src/main/java,frontend/src

# Codigo de pruebas
sonar.tests=microservicio/src/test/java

# El analizador de Java necesita las clases compiladas y sus dependencias
sonar.java.source=17
sonar.java.binaries=microservicio/target/classes
sonar.java.test.binaries=microservicio/target/test-classes
sonar.java.libraries=microservicio/target/dependency/*.jar

# Reportes de cobertura
sonar.coverage.jacoco.xmlReportPaths=microservicio/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/frontend/lcov.info

# Rutas que no se analizan
sonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,**/*.spec.ts,**/environments/**
sonar.test.inclusions=**/*.spec.ts,**/*Test.java,**/*IT.java
sonar.sourceEncoding=UTF-8

# Codigo que se analiza pero no se mide en la cobertura, porque no tiene logica
# que una prueba unitaria pueda verificar: entidades con solo getters y
# setters, registros de transporte de datos, interfaces de repositorio que
# implementa Spring Data, interfaces de modelos del cliente y los archivos de
# arranque. Siguen pasando por el analisis de bugs y vulnerabilidades; solo se
# quitan del calculo del porcentaje de cobertura.
#
# Los controladores, los servicios, la configuracion de seguridad y las
# pantallas NO estan aqui: tienen logica, y si no tienen pruebas, la cobertura
# debe mostrarlo.
sonar.coverage.exclusions=\
  microservicio/src/main/java/**/model/**,\
  microservicio/src/main/java/**/dto/**,\
  microservicio/src/main/java/**/repository/**,\
  microservicio/src/main/java/**/MicroservicioApplication.java,\
  frontend/src/app/models/**,\
  frontend/src/main.ts,\
  frontend/src/app/app.config.ts,\
  frontend/src/app/app.routes.ts

