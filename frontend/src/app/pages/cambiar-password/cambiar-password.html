<main class="contenedor">
  <section class="ui-tarjeta tarjeta" aria-labelledby="titulo">
    <div class="icono" aria-hidden="true"><i class="fa-solid fa-key"></i></div>
    <h1 id="titulo">Cree su contraseña</h1>
    <p class="explicacion">
      Hola {{ nombre }}. Ingresó con una contraseña temporal. Para continuar, cree una contraseña personal
      que solo usted conozca.
    </p>

    <form (ngSubmit)="cambiar()" novalidate>
      <label class="ui-campo">Contraseña temporal
        <input [type]="mostrar ? 'text' : 'password'" name="actual" [(ngModel)]="actual"
               autocomplete="current-password" required>
      </label>

      <label class="ui-campo">Nueva contraseña
        <input [type]="mostrar ? 'text' : 'password'" name="nueva" [(ngModel)]="nueva"
               autocomplete="new-password" required aria-describedby="requisitos">
      </label>

      <div id="requisitos">
        <app-politica-contrasena [clave]="nueva" [usuario]="nombreUsuario" [documento]="documento"></app-politica-contrasena>
      </div>

      <label class="ui-campo">Confirme la nueva contraseña
        <input [type]="mostrar ? 'text' : 'password'" name="confirmacion" [(ngModel)]="confirmacion"
               autocomplete="new-password" required>
      </label>

      <label class="mostrar">
        <input type="checkbox" name="mostrar" [(ngModel)]="mostrar"> Mostrar contraseñas
      </label>

      @if (error) {
        <p class="ui-mensaje peligro" role="alert">
          <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> {{ error }}
        </p>
      }

      <button type="submit" class="ui-boton primario" [disabled]="enviando">
        {{ enviando ? 'Guardando…' : 'Guardar y continuar' }}
      </button>
      <button type="button" class="ui-boton fantasma" (click)="salir()">Cerrar sesión</button>
    </form>
  </section>
</main>
