# =====================================================================
# Nginx del cliente web (HU-38 y HU-42)
#
# - Sirve la aplicación Angular y devuelve index.html en cualquier ruta del
#   cliente (/productos, /reportes...), para que recargar la página funcione.
# - Reenvía /api/ al backend, que no se publica fuera de la red de Docker.
# - Agrega las cabeceras de seguridad del sitio.
# =====================================================================

# Identificador de solicitud: se reutiliza el que llegue o se genera uno, y se
# pasa al backend para seguir la misma operación en los dos registros (HU-41).
map $http_x_request_id $id_solicitud {
    default   $http_x_request_id;
    ""        $request_id;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No anunciar la versión de Nginx.
    server_tokens off;

    # Mismo tope que el backend para la carga masiva.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Cabeceras de seguridad (HU-38) ----------------------------------
    # La aplicación solo carga recursos de su propio dominio. Los estilos en
    # línea se permiten porque Angular inyecta así los estilos de cada
    # componente; los scripts, en cambio, solo pueden venir del sitio.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # --- API --------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $id_solicitud;
        proxy_read_timeout 60s;
    }

    # El estado del backend no se publica: lo consulta Docker desde dentro.
    location /actuator/ {
        return 404;
    }

    # --- Archivos estáticos ---------------------------------------------
    # Los archivos con huella en el nombre (main-ABC123.js) no cambian nunca:
    # se guardan un año en caché.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html no se guarda en caché, para que una versión nueva se vea al
    # recargar.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri $uri/ /index.html;
    }
}
